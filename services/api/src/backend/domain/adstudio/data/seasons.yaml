# Season input vocabulary (ai-design §2.1): months, named seasons and holidays. Matching is on the
# lower-cased, accent-folded input with qualifiers such as "early"/"mid"/"late" and years removed.
version: 1
months:
  1: [january, jan, enero, janeiro, janvier, januar, gennaio]
  2: [february, feb, febrero, fevereiro, février, fevrier, februar, febbraio]
  3: [march, mar, marzo, março, marco, mars, märz, marz]
  4: [april, apr, abril, avril, aprile]
  5: [may, mayo, maio, mai, maggio]
  6: [june, jun, junio, junho, juin, juni, giugno]
  7: [july, jul, julio, julho, juillet, juli, luglio]
  8: [august, aug, agosto, août, aout]
  9: [september, sep, sept, septiembre, setembro, septembre, settembre]
  10: [october, oct, octubre, outubro, octobre, oktober, ottobre]
  11: [november, nov, noviembre, novembro, novembre]
  12: [december, dec, diciembre, dezembro, décembre, decembre, dezember, dicembre]
named_seasons:
  summer: [summer, summertime, verano, verão, verao, été, ete, sommer, estate]
  winter: [winter, wintertime, invierno, inverno, hiver]
  spring: [spring, springtime, primavera, printemps, frühling, fruhling]
  autumn: [autumn, fall, otoño, otono, outono, automne, herbst, autunno]
  tropical_wet: [wet season, rainy season, monsoon, monsoon season, rains]
  tropical_dry: [dry season]
# months: the months the holiday falls in (most years). by_country overrides for local dates.
# hemisphere_months overrides by hemisphere (e.g. back to school). months: [] = no fixed month.
holidays:
  christmas:
    name: Christmas
    aliases: [christmas, xmas, christmas time, navidad, natal, noël, noel, weihnachten]
    months: [12]
    cues: [a small decorated Christmas tree, string lights, wrapped gifts]
  holiday_season:
    name: Holiday season
    aliases: [holiday season, holidays, the holidays, festive season, festive]
    months: [12]
    cues: [tasteful festive decorations, warm string lights]
  new_year:
    name: New Year
    aliases: [new year, new year's, new years, new year's eve, nye, año nuevo, ano novo]
    months: [12, 1]
    cues: [subtle celebration sparkle, champagne-coloured accents]
  lunar_new_year:
    name: Lunar New Year
    aliases: [lunar new year, chinese new year, spring festival, cny, seollal, tet, tết]
    months: [1, 2]
    cues: [red paper lanterns, mandarin oranges, gold accents]
  valentines_day:
    name: Valentine's Day
    aliases: [valentine's day, valentines day, valentines, valentine]
    months: [2]
    cues: [a small bouquet of roses, soft pink and red accents]
  carnival:
    name: Carnival
    aliases: [carnival, carnaval, mardi gras]
    months: [2]
    cues: [colourful streamers and confetti, festive masks on a table]
  holi:
