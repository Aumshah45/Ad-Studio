    months: [3]
    cues: [bright coloured powder in small bowls, marigold flowers]
  easter:
    name: Easter
    aliases: [easter, pascua, páscoa, pascoa, pâques, paques, ostern]
    months: [3, 4]
    cues: [pastel painted eggs, spring flowers in a vase]
  songkran:
    name: Songkran
    aliases: [songkran, thai new year]
