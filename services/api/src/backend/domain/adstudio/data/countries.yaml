# Market facts for hemisphere/season resolution (ai-design §2.1). Deterministic; never a model.
#
# lat: representative latitude of where most people live (not the geometric centroid).
# hemisphere: derived from lat (|lat| < 10 -> equatorial) unless `hemisphere:` overrides it
#   (countries spanning both hemispheres are fixed by hand).
# climate: temperate | mediterranean | continental | polar | tropical | arid
#   (the season rules: temperate-like climates use meteorological seasons by hemisphere; tropical
#   uses wet/dry by `wet` months; arid uses hot/mild).
# wet: tropical wet-season months. currency: symbol or code. script: ISO 15924 of the main script.
# lang: Tesseract language packs for this market's Latin-script copy (besides eng).
# cities: aliases (lower-case) for geography_detail. cues: default locale cues for the fallback plan.
