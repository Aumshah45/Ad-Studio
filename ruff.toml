line-length = 100
target-version = "py313"
extend-exclude = ["apps", "services/api/.venv", "services/api/migrations/versions/__pycache__"]

[lint]
select = ["E", "F", "I", "B", "UP", "S"]

[lint.per-file-ignores]
"services/api/tests/**" = ["S101", "S105", "S106"]
"services/api/evals/**" = ["S101"]

[lint.isort]
known-first-party = ["backend", "evals"]
